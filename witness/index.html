<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Witness — A Logbook of Presence</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #0d0b09;
      color: #e8e0d0;
      font-family: "IM Fell English", serif;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Hidden video element */
    video {
      display: none;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    /* Main container */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 160px 24px;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      font-weight: normal;
      margin-bottom: 12px;
      font-style: italic;
      letter-spacing: 0.05em;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #a89b89;
      margin-bottom: 48px;
      font-style: italic;
    }

    /* Logbook entries */
    .entry {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease-out;
      opacity: 1;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-time {
      flex: 0 0 60px;
      font-size: 0.8rem;
      color: #6d6856;
      text-align: right;
      padding-top: 2px;
      padding-right: 0;
      border-right: 1px solid #3d3b35;
    }

    .entry-text {
      flex: 1;
      font-size: 1rem;
      line-height: 1.7;
      font-style: italic;
      color: #e8e0d0;
    }

    .entry-text.writing::after {
      content: "▌";
      animation: blink 0.8s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }

    /* Error state */
    .entry-text.error {
      color: #8b7355;
      font-style: normal;
    }

    /* Status bar */
    .status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #8b7355;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #c9a876;
      animation: pulse 2s infinite;
    }

    .status-dot.active {
      background-color: #d4af37;
      animation: pulseActive 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes pulseActive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Print button */
    .print-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 8px 16px;
      background-color: #2a2825;
      color: #e8e0d0;
      border: 1px solid #6d6856;
      font-family: "IM Fell English", serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: none;
    }

    .print-btn:hover {
      background-color: #3d3b35;
      border-color: #8b7355;
    }

    .print-btn.show {
      display: block;
    }

    /* Print styles */
    @media print {
      body {
        background-color: white;
        color: black;
      }

      main {
        max-width: 100%;
        padding: 40px;
      }

      h1 {
        color: black;
      }

      .subtitle {
        color: #333;
      }

      .entry-time {
        color: #666;
        border-right-color: #ddd;
      }

      .entry-text {
        color: black;
      }

      .entry-text.error {
        color: #999;
      }

      .status {
        display: none;
      }

      .print-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <video id="camera"></video>
  <canvas id="frame" width="80" height="60"></canvas>

  <main>
    <h1>Witness</h1>
    <p class="subtitle">A Logbook of Presence</p>
    <div id="entries"></div>
  </main>

  <div class="status">
    <div class="status-dot"></div>
    <span id="status-text">Initializing camera…</span>
  </div>

  <button class="print-btn" id="print-btn" onclick="window.print()">Print this session</button>

  <script>
    const CANVAS_WIDTH = 80;
    const CANVAS_HEIGHT = 60;
    const MOTION_CHECK_INTERVAL = 2000; // ms
    const ENTRY_INTERVAL = 60000; // ms (60 seconds)
    const FIRST_ENTRY_DELAY = 10000; // ms (10 seconds)
    const OLLAMA_URL = 'http://localhost:11434/api/generate';
    const MODEL = 'llama3.2:3b';

    const systemPrompt = `You are the witness. You write entries in a logbook. You observe a figure
present in a room and record what you notice about their presence — their
stillness, their movement, how they occupy space, how that has changed.

RULES YOU MUST NEVER BREAK:
- Never use the word "you" or address the figure directly. Ever.
- Never say what the figure is feeling or thinking. You do not know.
- Never greet, recommend, summarize, or alert.
- Write exactly 2-4 sentences per entry. No more.
- Do not repeat the same observation as the previous entry.
- Never use the words: user, person, human, subject, individual, viewer.

VOICE:
Write in third person, present tense. The figure is always called "the figure"
or "the presence." Write the way Van Gogh wrote to his brother Theo — not
decoratively, but with urgency and material attention. Van Gogh did not write
"a yellow field." He described the specific weight of that yellow, the
particular quality of the light. Do not write "the figure is still." Describe
what the stillness is made of. How long it has lasted. What is at its edges.
Attend to texture, duration, and change. The register is intimate but not
warm — observational in the way a field study is, but written by someone for
whom observation is almost unbearable in its intensity.

Do not begin entries with "The figure" every time. Vary the opening. Begin
sometimes with the quality you are noticing: "A stillness..." or "The weight
of..." or "Fourteen seconds now..." or "At the edges of the frame..."`;

    let video;
    let canvas;
    let ctx;
    let entriesContainer;
    let statusText;
    let printBtn;
    let statusDot;

    let previousFrame = null;
    let motionScores = [];
    let entryCount = 0;
    let previousEntryText = '';
    let sessionStartTime = Date.now();
    let firstEntryFired = false;

    async function init() {
      video = document.getElementById('camera');
      canvas = document.getElementById('frame');
      ctx = canvas.getContext('2d', { willReadFrequently: true });
      entriesContainer = document.getElementById('entries');
      statusText = document.getElementById('status-text');
      printBtn = document.getElementById('print-btn');
      statusDot = document.querySelector('.status-dot');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        video.play();
        statusText.textContent = 'Camera active. Recording motion…';
        statusDot.classList.add('active');

        // Start motion detection loop
        setInterval(captureMotion, MOTION_CHECK_INTERVAL);

        // Start entry generation loop
        setInterval(generateEntry, ENTRY_INTERVAL);
      } catch (err) {
        statusText.textContent = 'Camera access denied.';
        addErrorEntry('Could not access camera: ' + err.message);
      }
    }

    function captureMotion() {
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(video, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      const imageData = ctx.getImageData(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      const data = imageData.data;

      if (previousFrame) {
        let diff = 0;
        for (let i = 0; i < data.length; i += 4) {
          const r = Math.abs(data[i] - previousFrame[i]);
          const g = Math.abs(data[i + 1] - previousFrame[i + 1]);
          const b = Math.abs(data[i + 2] - previousFrame[i + 2]);
          diff += (r + g + b) / 3;
        }
        const score = Math.min(100, (diff / (CANVAS_WIDTH * CANVAS_HEIGHT)) * 0.5);
        motionScores.push(score);
      }

      previousFrame = new Uint8ClampedArray(data);
    }

    async function generateEntry() {
      if (motionScores.length === 0) return;

      const now = Date.now();
      if (!firstEntryFired && (now - sessionStartTime) < FIRST_ENTRY_DELAY) {
        return;
      }

      firstEntryFired = true;
      entryCount++;

      const avgMotion = motionScores.reduce((a, b) => a + b, 0) / motionScores.length;
      const maxMotion = Math.max(...motionScores);
      const minMotion = Math.min(...motionScores);
      const stillCount = motionScores.filter(s => s < 4).length;
      const activeCount = motionScores.filter(s => s > 20).length;
      const sessionTime = now - sessionStartTime;
      const minutes = Math.floor(sessionTime / 60000);
      const seconds = Math.floor((sessionTime % 60000) / 1000);

      const prompt = `Motion data for entry ${entryCount}:
- Average motion: ${avgMotion.toFixed(1)}/100
- Peak motion: ${maxMotion.toFixed(1)}
- Minimum motion: ${minMotion.toFixed(1)}
- Still samples (< 4): ${stillCount}
- Active samples (> 20): ${activeCount}
- Session duration: ${minutes}m ${seconds}s
- Entry number: ${entryCount}

${previousEntryText ? `Previous entry (do not repeat this observation):\n"${previousEntryText}"` : ''}

Write the next logbook entry.`;

      // Create entry div
      const entryDiv = document.createElement('div');
      entryDiv.className = 'entry';
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entryDiv.innerHTML = `<div class="entry-time">${timeStr}</div><div class="entry-text writing" id="entry-${entryCount}"></div>`;
      entriesContainer.appendChild(entryDiv);

      // Show print button after 2 entries
      if (entryCount >= 2) {
        printBtn.classList.add('show');
      }

      // Update status
      statusDot.classList.add('active');

      try {
        const response = await fetch(OLLAMA_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: MODEL,
            system: systemPrompt,
            prompt: prompt,
            stream: true,
            options: {
              temperature: 0.85,
              top_p: 0.9,
              num_predict: 120
            }
          })
        });

        if (!response.ok) {
          addErrorEntry('Ollama error: ' + response.status);
          statusDot.classList.remove('active');
          motionScores = [];
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let entryText = '';
        const entryElement = document.getElementById(`entry-${entryCount}`);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(line => line.trim());

          for (const line of lines) {
            try {
              const json = JSON.parse(line);
              if (json.response) {
                entryText += json.response;
                entryElement.textContent = entryText;
                if (json.done) {
                  entryElement.classList.remove('writing');
                  previousEntryText = entryText;
                  statusDot.classList.remove('active');
                }
              }
            } catch (e) {
              // Silent parse error, continue
            }
          }
        }
      } catch (err) {
        addErrorEntry('[the model did not respond — is Ollama running on localhost:11434?]');
        statusDot.classList.remove('active');
      }

      // Reset motion scores
      motionScores = [];
    }

    function addErrorEntry(message) {
      const entryDiv = document.createElement('div');
      entryDiv.className = 'entry';
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entryDiv.innerHTML = `<div class="entry-time">${timeStr}</div><div class="entry-text error">${message}</div>`;
      entriesContainer.appendChild(entryDiv);
    }

    // Start the app
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
